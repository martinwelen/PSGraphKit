name: Publish to PowerShell Gallery

on:
  push:
    tags: [ 'v*' ]
  # Runs the whole signing chain — OIDC login, Authenticode, catalog, verification, and a package
  # build against a throwaway local repository — and stops before the Gallery. Turns "the signing
  # pipeline should work" into something observed, without spending a version number to find out.
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Sign and verify, but do NOT publish to the Gallery'
        type: boolean
        default: true

# A tag push has been observed firing this workflow twice seconds apart (seen on v0.3.7). The
# first run publishes; the second takes a 409 "version already exists" and reports failure, which
# leaves a red cross on a release that actually succeeded. One run per tag, and let it finish.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# id-token is what lets azure/login federate without storing a client secret. Nothing else here
# needs write access.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish
    # Windows, not ubuntu: Authenticode signing goes through SignTool, which is Windows-only. The
    # test matrix still covers Linux and macOS in ci.yml — only the release path is pinned here.
    runs-on: windows-latest
    # Load-bearing, not decorative. The signing identity's federated credential is scoped to the
    # subject 'repo:martinwelen/PSGraphKit:environment:release', so the OIDC token only matches while
    # the job runs in this environment. Remove or rename it and azure/login fails with an
    # audience/subject mismatch. It is also where a required reviewer would be attached, if the
    # ability to sign should ever need a second pair of eyes.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Microsoft.Graph.Authentication -MinimumVersion 2.10.0 -Force -Scope CurrentUser

      # github.ref_name is a BRANCH name on workflow_dispatch, so this comparison is meaningless
      # there and would fail every dry run. It stays mandatory for the path that actually publishes.
      - name: Verify manifest matches tag
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = (Test-ModuleManifest ./src/PSGraphKit/PSGraphKit.psd1).Version.ToString()
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          Write-Host "Manifest: $version   Tag: $tag"
          if ($version -ne $tag) { throw "Manifest version ($version) does not match tag ($tag)." }

      - name: Report manifest version
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          Write-Host "Manifest version: $((Test-ModuleManifest ./src/PSGraphKit/PSGraphKit.psd1).Version)"

      # Every step that MODIFIES a file in ./src/PSGraphKit must run before signing. A signature
      # covers file content byte for byte, so a later edit silently invalidates it and the module
      # ships looking signed while failing verification on the installing machine.
      - name: Stage package docs
        shell: pwsh
        run: |
          # Ship README/LICENSE/CHANGELOG inside the module so the Gallery page is complete.
          Copy-Item README.md, LICENSE, CHANGELOG.md ./src/PSGraphKit/ -Force

      # PSData.ReleaseNotes is frozen at publish time and is what the Gallery page shows, so
      # 'See CHANGELOG.md' would send every visitor somewhere else, permanently, for that version.
      # Modifies the manifest, hence its place before signing.
      - name: Write release notes into the manifest
        shell: pwsh
        run: ./build/Set-GkReleaseNotes.ps1 -InformationAction Continue

      # An Authenticode signature on a BOM-less PowerShell file is hashed after decoding it with the
      # SIGNING machine's ANSI code page. This runner is 1252, so a file containing an em dash would
      # verify here and fail HashMismatch on a machine running 1251, 932, 936, 949 or the UTF-8 beta
      # option — and the verify step below cannot see it, because it agrees with the code page that
      # produced the hash. Refuse to sign anything ambiguous.
      - name: Guard against code-page-dependent signatures
        if: vars.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $missing = foreach ($f in Get-ChildItem ./src/PSGraphKit -Recurse -Include *.ps1, *.psm1, *.psd1, *.ps1xml) {
            $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
            if (-not ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)) { $f.FullName }
          }
          if ($missing) {
            $missing | ForEach-Object { Write-Host "::error file=$_::missing UTF-8 BOM; its signature would not verify outside code page 1252" }
            throw "$($missing.Count) file(s) would carry a code-page-dependent signature."
          }
          Write-Host "All signable files are UTF-8 with a BOM."

      - name: Azure login
        if: vars.SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Pass 1: Authenticode-sign the script files themselves. This is what an execution policy of
      # AllSigned checks when the module is dot-sourced or imported.
      - name: Sign module files
        if: vars.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\src\PSGraphKit
          files-folder-filter: ps1,psm1,psd1,ps1xml
          files-folder-recurse: true
          file-digest: SHA256
          # Not optional. Artifact Signing certificates live 72 hours; without an RFC 3161
          # countersignature every signature we ship expires within three days.
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Pass 2: the catalog hashes every file in the module, including the ones Authenticode cannot
      # sign (README, LICENSE, .cat aside). It must be built AFTER pass 1, because signing changed
      # the script files and the catalog records their post-signature hashes.
      - name: Build file catalog
        if: vars.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $cat = './src/PSGraphKit/PSGraphKit.cat'
          if (Test-Path $cat) { Remove-Item $cat -Force }
          New-FileCatalog -Path ./src/PSGraphKit -CatalogFilePath $cat -CatalogVersion 2 | Out-Null
          Write-Host "Catalog built: $((Get-Item $cat).Length) bytes"

      - name: Sign the catalog
        if: vars.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\src\PSGraphKit
          files-folder-filter: cat
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Verify before publishing, not after. Once a version is on the Gallery it cannot be replaced,
      # and a module that installs but fails signature validation is worse than an unsigned one.
      - name: Verify signatures
        if: vars.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $failed = @()

          $signable = Get-ChildItem ./src/PSGraphKit -Recurse -Include *.ps1, *.psm1, *.psd1, *.ps1xml
          foreach ($f in $signable) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne 'Valid') { $failed += "$($f.Name): $($sig.Status) - $($sig.StatusMessage)" }
            elseif (-not $sig.TimeStamperCertificate) { $failed += "$($f.Name): signed but NOT timestamped (expires with the 72h certificate)" }
          }

          $catSig = Get-AuthenticodeSignature ./src/PSGraphKit/PSGraphKit.cat
          if ($catSig.Status -ne 'Valid') { $failed += "PSGraphKit.cat: $($catSig.Status) - $($catSig.StatusMessage)" }

          # Does the catalog actually match what is on disk?
          $test = Test-FileCatalog -Path ./src/PSGraphKit -CatalogFilePath ./src/PSGraphKit/PSGraphKit.cat -Detailed
          if ($test.Status -ne 'Valid') { $failed += "Catalog does not match the module contents: $($test.Status)" }

          if ($failed) { $failed | ForEach-Object { Write-Host "::error::$_" }; throw "Signature verification failed on $($failed.Count) item(s)." }
          Write-Host "Verified $($signable.Count) signed file(s) plus the catalog, all timestamped."

      # Signing is a one-way door. v0.4.2 shipped signed, so PowerShellGet's publisher check now
      # refuses to install any later unsigned version over it without -SkipPublisherCheck. A
      # mistyped or deleted repository variable must therefore stop the release, not narrate it:
      # every signing step above is conditional, while the publish step below is not, so without
      # this the pipeline would happily push an upgrade-breaking package.
      - name: Refuse to publish unsigned
        if: vars.SIGNING_ENABLED != 'true'
        shell: pwsh
        run: |
          throw "SIGNING_ENABLED is not 'true', so nothing was signed. Published versions from v0.4.2 onward are signed, and an unsigned release fails PowerShellGet's publisher check on upgrade. Set the repository variable, or publish deliberately by hand if this is genuinely intended."

      # Skipping the package build entirely would leave the riskiest untested thing untested: that a
      # signed module, catalog and all, still packages. Publishing to a throwaway local repository
      # exercises the real nupkg build without touching the Gallery.
      - name: Build the package (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run == true
        shell: pwsh
        run: |
          $local = Join-Path $env:RUNNER_TEMP 'dryrun-repo'
          New-Item -ItemType Directory -Path $local -Force | Out-Null
          Register-PSResourceRepository -Name DryRun -Uri $local -Trusted -Force
          # -SkipDependenciesCheck is required here and only here: publishing resolves declared
          # dependencies against the TARGET repository, and Microsoft.Graph.Authentication is not in
          # this empty local folder. The real Gallery publish keeps the check, where it is meaningful.
          Publish-PSResource -Path ./src/PSGraphKit -Repository DryRun -SkipDependenciesCheck -Verbose
          $pkg = Get-ChildItem $local -Filter *.nupkg
          if (-not $pkg) { throw 'Dry run produced no package.' }
          Write-Host "Package built: $($pkg.Name) ($([math]::Round($pkg.Length / 1KB)) KB)"
          "PACKAGE=$($pkg.Name)" | Out-File $env:GITHUB_ENV -Append

      - name: Dry run summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run == true
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature ./src/PSGraphKit/PSGraphKit.psd1
          $lines = @(
            '## Dry run — nothing was published'
            ''
            "| | |"
            "|---|---|"
            "| Module version | $((Test-ModuleManifest ./src/PSGraphKit/PSGraphKit.psd1).Version) |"
            "| Package | $env:PACKAGE |"
            "| Signing enabled | ${{ vars.SIGNING_ENABLED }} |"
            "| Signature status | $($sig.Status) |"
            "| Signer | $($sig.SignerCertificate.Subject) |"
            "| Thumbprint | $($sig.SignerCertificate.Thumbprint) |"
            "| Certificate expires | $($sig.SignerCertificate.NotAfter) |"
            "| Timestamped by | $($sig.TimeStamperCertificate.Subject) |"
            ''
            'A 72-hour signing certificate is expected. What matters is the timestamp: with it the'
            'signature outlives the certificate, without it every signature expires in three days.'
          )
          $lines -join "`n" | Out-File $env:GITHUB_STEP_SUMMARY -Append

      # Belt and braces. A tag push always publishes; the dry-run input only exists on a manual run,
      # where it defaults to true. Stating both conditions beats relying on `null != true`.
      - name: Publish to PSGallery
        if: github.event_name == 'push' || inputs.dry-run != true
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          Publish-PSResource -Path ./src/PSGraphKit -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY -Verbose
